          "text": "Урок 1. Крийя йога. Введение\nТема 1\nКрийя йога  .   .   .   .  Введение\nВсе мы обладаем потенциальными возможностями, которые\nмы обычно не используем и даже не подозреваем об их су\nществовании. Крийя йога – это древняя и мощная система,\nпредназначенная для того, чтобы дать человеку возможность\nполностью раскрыть свой потенциал. В последние десятиле\nтия интерес к ней возродился благодаря усилиям таких учите\nлей, как Свами Шивананда, Парамахамса Йогананда и Свами\nСатьянанда Сарасвати. \nЧто такое крийя йога?\nСлово крийя означает «действие». Поэтому крийя йога – это\nйога действия. В отличие от многих других систем йоги, она\nне требует подавления ума или чувств. Напротив, она учит\nнас использовать наши действия и осознание как средство\nдля достижения высших состояний сознания. Крийя йога со\nстоит из ряда техник, которые включают в себя асаны, пра\nнаяму, мудры, бандхи и медитативные практики. \nПроисхождение крийя йоги\nСчитается, что крийя йога была передана Господом Шивой\nсвоей супруге Парвати. В течение многих веков она остава\nлась тайным учением, передаваемым от учителя к ученику. В\nнаше время она стала доступной для всех, кто искренне же\nлает заниматься самосовершенствованием. \nБлага крийя йоги\nПрактика крийя йоги приносит многочисленные блага как на\nфизическом, так и на умственном и духовном уровнях. Она\nпомогает укрепить тело, успокоить ум, развить концентрацию\nи достичь глубокого внутреннего покоя. В конечном итоге\nона ведет к самопознанию и просветлению.\n18\nЙога и крийя. Вводный курс",

          "text": "Урок 1. Хатха йога. Джала нети\nТема 2\nХатха йога  .   .   .   .  Джала нети\nДжала нети – это простая, но чрезвычайно эффективная тех\nника очищения носовых проходов с помощью соленой воды.\nОна является одной из шести очистительных практик (шат\nкарм) хатха йоги. Регулярное выполнение джала нети помо\nгает поддерживать здоровье органов дыхания, улучшает зре\nние и способствует ясности ума.\nПринадлежности\nДля выполнения джала нети вам понадобится специальный\nсосуд, называемый нети лота. Он похож на маленький чайник\nс длинным носиком, который вставляется в ноздрю. Также\nвам потребуется теплая вода и соль. \nПодготовка воды\nВода должна быть чистой и иметь температуру тела. На пол\nлитра воды следует добавить одну чайную ложку соли. Тща\nтельно размешайте соль до полного растворения. Соленость\nводы должна соответствовать солености слез. \nТехника выполнения\n1. Встаньте прямо, слегка расставив ноги.\n2. Наклонитесь вперед и поверните голову вправо.\n3. Осторожно вставьте носик нети лоты в левую ноздрю.\n4. Медленно вливайте воду в левую ноздрю. Она должна вы\nтекать из правой ноздри.\n5. Дышите через рот.\n6. Повторите процедуру для другой стороны.\n7. После завершения тщательно просушите нос, делая корот\nкие резкие выдохи через обе ноздри.\n31\nЙога и крийя. Вводный курс",

        "3": {
          "name": "Асаны. Правила и приготовления",
          "text": "Урок 2. Асаны. Правила и приготовления\nТема 3\nАсаны  .   .   .   .  Правила и приготовления\nДля того чтобы практика асан была эффективной и безопас\nной, необходимо соблюдать определенные правила. \nМесто для занятий\nВыберите чистое, проветриваемое и тихое место. Желатель\nно заниматься на твердой поверхности, застеленной коври\nком или одеялом. \nВремя занятий\nЛучшее время для практики – раннее утро, когда ум споко\nен, а тело отдохнуло. Однако можно заниматься и в другое\nвремя, главное – на пустой желудок (минимум через 3–4 ча\nса после еды). \nОдежда\nОдежда должна быть легкой, свободной и не стеснять дви\nжений. Лучше всего использовать натуральные ткани. \nОсознание и дыхание\nВсегда осознавайте то, что вы делаете. Дышите только че\nрез нос, если нет других указаний. Не перенапрягайтесь и не\nделайте резких движений. Йога – это не соревнование, слу\nшайте свое тело.\n100\nЙога и крийя. Вводный курс",
          "start_page": 100,
          "end_page": 106
        },
        "4": {
          "name": "Асаны. Упражнения",
          "text": "Урок 2. Асаны. Упражнения\nТема 4\nАсаны  .   .   .   .  Упражнения\nВ этом уроке мы познакомим вас с несколькими динамиче\nскими упражнениями, которые отлично разогревают тело и\nподготавливают его к статическим асанам. \nВращение плечами\nСядьте или встаньте прямо. Вращайте плечами сначала впе\nред, затем назад. Это снимает напряжение с шеи и верхней\nчасти спины. \nВращение запястьями\nВытяните руки перед собой и вращайте кистями в обе сто\nроны. Это полезно для тех, кто много пишет или работает за\nкомпьютером. \nМарджариасана (поза кошки)\nВстаньте на четвереньки. При вдохе прогибайте спину вниз,\nподнимая голову. При выдохе выгибайте спину вверх, опус\nкая голову. Это упражнение делает позвоночник гибким и\nулучшает работу органов брюшной полости. \nПоза скручивания позвоночника\nСядьте на пол, скрестив ноги. Поверните туловище вправо,\nпомогая себе руками. Повторите в другую сторону. Это мяг\nко растягивает спину и тонизирует нервную систему.\n107\nЙога и крийя. Вводный курс",
          "start_page": 107,
          "end_page": 111
        },
        "5": {
          "name": "Асаны. Простые медитативные асаны",
          "text": "Урок 2. Асаны. Простые медитативные асаны\nТема 5\nАсаны  .   .   .   .  Простые медитативные асаны\nДля практики медитации и пранаямы необходимо уметь си\nдеть с прямой спиной в течение длительного времени. Су\nществует несколько простых поз, которые доступны боль\nшинству людей. \nСукхасана (удобная поза)\nСядьте на пол, скрестив ноги. Спина должна быть прямой,\nруки лежат на коленях. Если вам трудно сидеть, можно под\nложить под ягодицы подушку. \nАрдха Падмасана (полулотос)\nПоместите одну стопу на противоположное бедро, а другую\n– под бедро. Это более устойчивая поза, чем сукхасана.\nВаджрасана (поза алмаза)\nВстаньте на колени и сядьте на пятки. Спина прямая, руки на\nколенях. Это единственная поза, которую можно выполнять\nсразу после еды, так как она улучшает пищеварение. \nВыберите ту позу, в которой вам наиболее комфортно, и\nстарайтесь постепенно увеличивать время пребывания в ней.\n112\nЙога и крийя. Вводный курс",
          "start_page": 112,
          "end_page": 115
        },
        "6": {
          "name": "Пранаяма. Самавета пранаяма",
          "text": "Урок 2. Пранаяма. Самавета пранаяма\nТема 6\nПранаяма  .   .   .   .  Самавета пранаяма\nСамавета пранаяма – это практика совместного дыхания че\nрез обе ноздри. Она помогает успокоить нервную систему и\nподготавливает ум к более продвинутым техникам праная\nмы. \nТехника выполнения\n1. Сядьте в любую медитативную позу с прямой спиной.\n2. Закройте глаза и расслабьтесь.\n3. Сделайте глубокий медленный вдох через обе ноздри.\n4. Сделайте такой же медленный и полный выдох.\n5. Старайтесь, чтобы вдох и выдох были одинаковой продол\nжительности.\n6. Осознавайте поток воздуха и движение грудной клетки.\nПродолжайте практику в течение 5–10 минут. Вы почувству\nете, как ваше тело наполняется покоем, а ум становится\nясным.\n116\nЙога и крийя. Вводный курс",
          "start_page": 116,
          "end_page": 118
        },
        "7": {
          "name": "Первопричина напряжённости",
          "text": "Урок 2. Первопричина напряжённости\nТема 7\nПервопричина напряжённости\nНапряженность – это бич современного человека. Она про\nявляется не только в виде физической скованности, но и в\nвиде беспокойных мыслей, страхов и неудовлетворенности.\nЙога учит нас находить и устранять первопричины этой на\nпряженности. \nУм и тело\nУм и тело тесно связаны. Каждая беспокойная мысль отра\nжается в теле в виде мышечного зажима. Напротив, физиче\nская усталость и боль делают ум раздражительным. \nЭго и желания\nОдной из главных причин напряженности является наше эго\nи бесконечные желания. Мы постоянно чего-то хотим, боим\nся что-то потерять или стремимся кому-то что-то доказать.\nЭто держит нас в состоянии непрерывной борьбы. \nПуть к освобождению\nОсознание – это первый шаг к освобождению. Наблюдая за\nсвоими мыслями и реакциями, мы начинаем понимать меха\nнизмы возникновения напряжения. Практика асан, праная\nмы и медитации помогает нам шаг за шагом сбрасывать это\nбремя и обретать подлинную свободу и радость.\n119\nЙога и крийя. Вводный курс",
          "start_page": 119,
          "end_page": 132
        },
        "8": {
          "name": "Релаксация. Шавасана (часть 2)",
          "text": "Урок 2. Релаксация. Шавасана (часть 2)\nТема 8\nРелаксация  .   .   .   .  Шавасана (часть 2)\nВ этом уроке мы углубим практику шавасаны. Теперь мы\nбудем не просто расслаблять тело, но и учиться осознавать\nсвое дыхание и внутренние процессы. \nТехника выполнения\n1. Лягте на спину в удобную позу.\n2. Закройте глаза и почувствуйте все свое тело целиком.\n3. Перенесите внимание на дыхание. Наблюдайте, как воздух\nвходит и выходит, не пытаясь его контролировать.\n4. Представьте, что с каждым выдохом из вашего тела выхо\nдит все напряжение и усталость.\n5. Почувствуйте, как ваше тело становится тяжелым и как\nбудто погружается в пол.\n6. Оставайтесь в этом состоянии 10–15 минут.\nШавасана – это не сон. Это состояние глубокого бодрство\nвания в полном покое. Регулярная практика шавасаны по\nзволяет полностью перезагрузить нервную систему и обрести\nневероятный заряд энергии.\n133\nЙога и крийя. Вводный курс",
          "start_page": 133,
          "end_page": 136
        }
      }
    },
    "3": {
      "name": "Урок 3",
      "topics": {
        "1": {
          "name": "Симха крийя. Зевок льва",
          "text": "Урок 3. Симха крийя. Зевок льва\nТема 1\nСимха крийя  .   .   .   .  Зевок льва\nСимха крийя – это простое, но мощное упражнение для\nочищения горла и укрепления голосовых связок. Оно также\nпомогает избавиться от психологических зажимов и страха\nсамовыражения. \nТехника выполнения\n1. Сядьте в ваджрасану (на пятки), слегка расставив колени.\n2. Положите руки на колени, пальцы широко расставлены.\n3. Сделайте глубокий вдох.\n4. На выдохе широко откройте рот и максимально высуньте\nязык вниз к подбородку. \n5. Одновременно издайте громкий рычащий звук «Х-а-а-а»,\nидущий из горла.\n6. Взгляд направьте в точку между бровями (шамбхави му\nдра).\nПовторите 5–10 раз. Это упражнение отлично снимает на\nпряжение с лица и шеи, а также помогает при лечении за\nболеваний носоглотки.\n142\nЙога и крийя. Вводный курс",
          "start_page": 142,
          "end_page": 146
        },
        "2": {
          "name": "Асаны. Практика",
          "text": "Урок 3. Асаны. Практика\nТема 2\nАсаны  .   .   .   .  Практика\nВ этом уроке мы познакомимся с группой упражнений па\nванмуктасана, которая предназначена для освобождения ор\nганизма от газов и улучшения работы пищеварительной сис\nтемы. \nПаванмуктасана (часть 1)\nЛягте на спину. Согните правую ногу и прижмите колено к\nгруди, обхватив его руками. Задержитесь на несколько се\nкунд, затем выпрямите ногу. Повторите для левой ноги, а за\nтем для обеих ног вместе. \nБхуджангасана (поза кобры) – подготовка\nЛягте на живот, руки под плечами. Медленно поднимайте\nголову и грудь, опираясь на руки. Это упражнение укрепляет\nспину и массирует органы брюшной полости. \nШашанкасана (поза кролика)\nСядьте на пятки, руки за спиной. Наклонитесь вперед, каса\nясь лбом пола. Это поза глубокого расслабления и покоя.\n147\nЙога и крийя. Вводный курс",
          "start_page": 147,
          "end_page": 157
        },
        "3": {
          "name": "Прана. Введение",
          "text": "Урок 3. Прана. Введение\nТема 3\nПрана  .   .   .   .  Введение\nПрана – это универсальная жизненная энергия, которая про\nнизывает всю вселенную и поддерживает жизнь во всех су\nществах. В йоге мы учимся осознавать и управлять этой\nэнергией для достижения здоровья и долголетия. \nПрана в теле\nВ человеческом теле прана движется по каналам, которые\nназываются нади. Всего их насчитывается 72 000, но основ\nными являются три: ида, пингала и сушумна. \nДыхание и прана\nДыхание – это самый доступный способ воздействия на\nпрану. Пранаяма – это наука управления дыханием с целью\nгармонизации потоков праны. \nОсознание праны\nС помощью специальных техник мы можем научиться чув\nствовать движение праны в теле в виде тепла, покалывания\nили вибрации. Это осознание открывает путь к более глубо\nкому пониманию своей природы.\n158\nЙога и крийя. Вводный курс",
          "start_page": 158,
          "end_page": 173
        },
        "4": {
          "name": "Пранаяма. Нади шодхана (этап 1)",
          "text": "Урок 3. Пранаяма. Нади шодхана (этап 1)\nТема 4\nПранаяма  .   .   .   .  Нади шодхана (этап 1)\nНади шодхана – это одна из самых важных практик праная\nмы. Ее название переводится как «очищение каналов». На\nпервом этапе мы учимся попеременно дышать через правую\nи левую ноздри. \nТехника выполнения\n1. Сядьте в удобную медитативную позу.\n2. Используйте насагра мудру: указательный и средний паль\nцы правой руки прижаты к ладони (или к точке между бро\nвями). Большой палец закрывает правую ноздрю, а безымян\nный – левую.\n3. Закройте правую ноздрю и медленно вдохните через ле\nвую.\n4. Закройте левую ноздрю и выдохните через правую.\n5. Вдохните через правую ноздрю.\n6. Выдохните через левую ноздрю.\nЭто один цикл. Старайтесь, чтобы дыхание было бесшум\nным и ритмичным. Продолжайте в течение 5–10 минут.\n174\nЙога и крийя. Вводный курс",
          "start_page": 174,
          "end_page": 178
        },
        "5": {
          "name": "Осознание. Введение",
          "text": "Урок 3. Осознание. Введение\nТема 5\nОсознание  .   .   .   .  Введение\nОсознание – это ключ к успеху в любой практике йоги. Без\nосознания асаны становятся просто физкультурой, а праная\nма – дыхательной гимнастикой. \nБыть свидетелем\nОсознание означает способность быть сторонним наблюда\nтелем (свидетелем) своих действий, чувств и мыслей. Это\nпозволяет нам не вовлекаться в них и сохранять внутреннее\nравновесие. \nОсознание в повседневной жизни\nЙога призывает нас быть осознанными не только на коври\nке, но и в течение всего дня. Осознавайте, как вы едите, как\nходите, как разговариваете с другими людьми. \nСила настоящего момента\nОсознание всегда происходит СЕЙЧАС. Прошлое уже ушло,\nбудущее еще не наступило. Только в настоящем моменте мы\nможем по-настоящему жить и действовать.\n179\nЙога и крийя. Вводный курс",
          "start_page": 179,
          "end_page": 187
        },
        "6": {
          "name": "Медитация. Осознание тела",
          "text": "Урок 3. Медитация. Осознание тела\nТема 6\nМедитация  .   .   .   .  Осознание тела\nЭта простая медитативная практика помогает развить кон\nцентрацию и глубоко расслабиться. Она учит нас чувство\nвать свое тело изнутри. \nТехника выполнения\n1. Сядьте в удобную позу и закройте глаза.\n2. Перенесите внимание на стопы. Почувствуйте их тепло,\nвес, соприкосновение с полом. \n3. Постепенно перемещайте внимание выше: голени, коле\nни, бедра, таз.\n4. Осознайте свою спину, живот, грудную клетку.\n5. Почувствуйте свои руки, плечи, шею.\n6. В конце осознайте все свое тело целиком, как единое гар\nмоничное целое.\nЕсли ваш ум отвлекается, просто мягко возвращайте его к\nощущениям в теле. Продолжайте в течение 10–15 минут.\n188\nЙога и крийя. Вводный курс",
          "start_page": 188,
          "end_page": 192
        }
      }
    },
    "4": {
      "name": "Урок 4",
      "topics": {
        "1": {
          "name": "Хатха йога. Кунджал крийя",
          "text": "Урок 4. Хатха йога. Кунджал крийя\nТема 1\nХатха йога  .   .   .   .  Кунджал крийя\nКунджал крийя – это метод очищения желудка с помощью\nсоленой воды. Эта практика помогает избавиться от лишней\nслизи, желчи и токсинов, а также улучшает работу всей пи\nщеварительной системы. \nТехника выполнения\n1. Приготовьте около 2 литров теплой воды с солью (1 чай\nная ложка на литр).\n2. Быстро выпейте 6–8 стаканов воды, пока не почувствуете,\nчто желудок полон.\n3. Наклонитесь над тазом, вставьте два пальца в горло и на\nжмите на корень языка. \n4. Вода выйдет наружу вместе с содержимым желудка. \nПродолжайте, пока не выйдет вся вода. Эту процедуру луч\nше всего делать утром натощак. Она отлично борется с не\nсварением, гастритом и даже астмой.\n196\nЙога и крийя. Вводный курс",
          "start_page": 196,
          "end_page": 208
        },
        "2": {
          "name": "Асаны. Практика",
          "text": "Урок 4. Асаны. Практика\nТема 2\nАсаны  .   .   .   .  Практика\nВ этом уроке мы добавим в нашу программу несколько важ\nных асан, которые укрепляют позвоночник и органы брюш\nной полости. \nСарпасана (поза змеи)\nЛягте на живот, руки сцеплены за спиной. На вдохе подни\nмайте голову и грудь, вытягивая руки назад. Это упражне\nние отлично раскрывает грудную клетку. \nНаукасана (поза лодки)\nЛягте на спину. Одновременно поднимите ноги, руки и го\nлову на высоту около 30 см. Напрягите все тело и удержи\nвайте позу в течение нескольких секунд. Это укрепляет\nмышцы живота и спины. \nШавасана\nВсегда завершайте практику асан глубоким расслаблением в\nшавасане.",
          "start_page": 209,
          "end_page": 222
        },
        "3": {
          "name": "Пранаяма",
          "text": "Урок 4. Пранаяма\nТема 3\nПранаяма  .   .   .   .  Введение\nВ этом уроке мы обсудим основные принципы пранаямы и ее\nвоздействие на наш организм. Пранаяма – это не просто ды\nхательные упражнения, это наука о жизни. \nФизиологический аспект\nПранаяма улучшает вентиляцию легких, насыщает кровь\nкислородом и помогает вывести токсины. Она также успока\nивает нервную систему, переключая ее в режим расслабле\nния (парасимпатический отдел). \nПсихологический аспект\nУправляя дыханием, мы управляем своим умом. Медленное\nи глубокое дыхание помогает избавиться от тревоги, гнева и\nстраха. \nЭнергетический аспект\nПранаяма очищает энергетические каналы (нади) и позво\nляет пране свободно течь по всему телу, что ведет к ощуще\nнию бодрости и приливу сил.\n223\nЙога и крийя. Вводный курс",
          "start_page": 223,
          "end_page": 233
        },
        "4": {
          "name": "Пранаяма. Правила",
          "text": "Урок 4. Пранаяма. Правила\nТема 4\nПранаяма  .   .   .   .  Правила\nЧтобы занятия пранаямой приносили пользу и были без\nопасными, необходимо соблюдать следующие правила. \nМесто и время\nЗанимайтесь в чистом, хорошо проветриваемом месте. Луч\nшее время – раннее утро или вечер. \nПоза\nСидите с прямой спиной. Голова, шея и спина должны быть\nна одной линии. \nПустой желудок\nНикогда не занимайтесь пранаямой сразу после еды. По\nдождите минимум 3–4 часа. \nПостепенность\nНе форсируйте задержку дыхания. Увеличивайте продолжи\nтельность вдоха и выдоха постепенно, без напряжения. Если\nвы чувствуете дискомфорт – немедленно прекратите прак\nтику.\n234\nЙога и крийя. Вводный курс",
          "start_page": 234,
          "end_page": 236
        },
        "5": {
          "name": "Пранаяма. Нади шодхана (этап 2)",
          "text": "Урок 4. Пранаяма. Нади шодхана (этап 2)\nТема 5\nПранаяма  .   .   .   .  Нади шодхана (этап 2)\nНа втором этапе нади шодханы мы вводим задержку дыха\nния после вдоха (антар кумбхака). Это делает практику\nнамного более мощной. \nТехника выполнения\n1. Сядьте в удобную позу и приготовьтесь к попеременному\nдыханию.\n2. Закройте правую ноздрю и вдохните через левую.\n3. Закройте обе ноздри и задержите дыхание на несколько\nсекунд.\n4. Откройте правую ноздрю и выдохните.\n5. Вдохните через правую ноздрю.\n6. Снова задержите дыхание.\n7. Откройте левую ноздрю и выдохните.\nНачинайте с небольших задержек. Ваша цель – достичь со\nотношения 1:1:1 (вдох: задержка: выдох), а затем постепен\nно переходить к 1:2:2.\n237\nЙога и крийя. Вводный курс",
          "start_page": 237,
          "end_page": 240
        },
        "6": {
          "name": "Медитация. Практика",
          "text": "Урок 4. Медитация. Практика\nТема 6\nМедитация  .   .   .   .  Практика\nВ этом уроке мы будем учиться осознавать свои мысли. Это\nпервый шаг к тому, чтобы стать хозяином своего ума. \nТехника выполнения\n1. Сядьте с прямой спиной и закройте глаза.\n2. Просто наблюдайте за потоком своих мыслей, как будто вы\nсмотрите на облака, плывущие по небу. \n3. Не пытайтесь остановить мысли или оценивать их. Про\nсто осознавайте их присутствие. \n4. Если вы обнаружите, что увлеклись какой-то мыслью,\nпросто мягко вернитесь в позицию наблюдателя.\nВы обнаружите, что когда вы начинаете наблюдать за мыс\nлями, они постепенно замедляются и их становится меньше.\nЗанимайтесь этим упражнением 10–15 минут ежедневно.\n241\nЙога и крийя. Вводный курс",
          "start_page": 241,
          "end_page": 245
        }
      }
    },
    "5": {
      "name": "Урок 5",
      "topics": {
        "1": {
          "name": "Что такое йога?",
          "text": "Урок 5. Что такое йога?\nТема 1\nЧто такое йога?\nМногие люди думают, что йога – это просто гимнастика или\nрелигия. На самом деле, йога – это целостная система само\nпознания, которая охватывает все аспекты человеческого\nбытия: физический, энергетический, эмоциональный и ду\nховный. \nПуть к единству\nСамо слово «йога» происходит от санскритского корня\n«юдж», что означает «единение» или «связь». Это единение\nиндивидуального сознания с универсальным. \nВосемь ступеней йоги\nВеликий мудрец Патанджали описал восьмиступенчатый\nпуть йоги (Аштанга йога), который включает в себя этиче\nские правила (яма и нияма), физические позы (асана), управ\nление дыханием (пранаяма) и различные уровни работы с\nумом (пратьяхара, дхарана, дхьяна и самадхи).\nЙога в современной жизни\nВ наше время йога является незаменимым инструментом для\nподдержания здоровья, снятия стресса и обретения внутрен\nнего смысла жизни. Она доступна каждому, независимо от\nвозраста, пола или вероисповедания.\n250\nЙога и крийя. Вводный курс",
          "start_page": 250,
          "end_page": 267
        },
        "2": {
          "name": "Сурья намаскар",
          "text": "Урок 5. Сурья намаскар\nТема 2\nСурья намаскар .   .   .   .  Приветствие Солнцу\nСурья намаскар – это одна из самых известных и полезных\nпрактик в йоге. Она представляет собой серию из 12 по\nследовательных поз, которые выполняются как единый ди\nнамический поток. \nБлаготворное действие\nПриветствие Солнцу оживляет весь организм, растягивает и\nукрепляет все основные группы мышц, улучшает пищеваре\nние и стимулирует работу нервной системы. Это идеальная\nзарядка для начала дня. \nТехника выполнения\nКаждая поза в Сурья намаскар сопровождается определен\nным дыханием (вдох или выдох) и концентрацией на энерге\nтических центрах (чакрах). \n1. Пранамасана (поза молитвы)\n2. Хаста Уттанасана (поза с поднятыми руками)\n3. Падахастасана (наклон вперед)\n4. Ашва Санчаласана (поза всадника)\n... и так далее. \nНачинайте с 3–6 циклов и постепенно доводите их количе\nство до 12. Помните о плавности движений и осознанности\nдыхания.\n268\nЙога и крийя. Вводный курс",
          "start_page": 268,
          "end_page": 292
        },
        "3": {
          "name": "Хатха йога. Ватсара дхоути",
          "text": "Урок 5. Хатха йога. Ватсара дхоути\nТема 3\nХатха йога  .   .   .   .  Ватсара дхоути\nВатсара дхоути – это метод очищения желудочно-кишечного\nтракта с помощью воздуха. Эта практика помогает улуч\nшить пищеварение и избавиться от газов. \nТехника выполнения\n1. Сложите губы в форме «вороньего клюва» (каки мудра).\n2. Медленно «заглатывайте» воздух ртом, направляя его в\nжелудок.\n3. Сделайте столько глотков, сколько сможете.\n4. Удерживайте воздух в желудке в течение некоторого вре\nмени.\n5. Затем удалите воздух через рот (отрыжка).\nЭту практику следует выполнять осторожно и лучше всего\nутром натощак. Она отлично стимулирует работу органов\nбрюшной полости.\n293\nЙога и крийя. Вводный курс",
          "start_page": 293,
          "end_page": 295
        },
        "4": {
          "name": "Пранаяма. Нади шодхана (этап 3)",
          "text": "Урок 5. Пранаяма. Нади шодхана (этап 3)\nТема 4\nПранаяма  .   .   .   .  Нади шодхана (этап 3)\nНа третьем этапе нади шодханы мы продолжаем работать с\nзадержкой дыхания, постепенно увеличивая ее продолжи\nтельность и устанавливая четкий ритм. \nТехника выполнения\nТеперь мы стараемся достичь соотношения 1:4:2 (вдох: за\nдержка: выдох). Это означает, что если вы вдыхаете за 4 се\nкунды, то должны задерживать дыхание на 16 секунд и вы\nдыхать за 8 секунд. \nВажное примечание\nНикогда не перенапрягайтесь. Если вы чувствуете, что вам\nне хватает воздуха, уменьшите время задержки. Ритм дол\nжен быть комфортным. Регулярная практика приведет вас к\nжелаемому результату естественным путем.\n296\nЙога и крийя. Вводный курс",
          "start_page": 296,
          "end_page": 301
        },
        "5": {
          "name": "Медитация. Анулома вилома и прана шуддхи",
          "text": "Урок 5. Медитация. Анулома вилома и прана шуддхи\nТема 5\nМедитация  .   .   .   .  Анулома вилома и прана шуддхи\nЭта медитативная практика основана на осознании потока\nдыхания в ноздрях без использования рук. Она помогает\nсбалансировать работу полушарий мозга и успокоить ум. \nТехника выполнения\n1. Сядьте в удобную позу и закройте глаза.\n2. Направьте все внимание на ноздри.\n3. Почувствуйте, как воздух входит через обе ноздри и под\nнимается к точке между бровями.\n4. Представьте, что вы вдыхаете через левую ноздрю, а вы\nдыхаете через правую. \n5. Затем вдохните через правую и выдохните через левую. \n6. Постепенно это «психическое» дыхание станет очень от\nчетливым и приведет вас в состояние глубокого покоя.\n302\nЙога и крийя. Вводный курс",
          "start_page": 302,
          "end_page": 305
        }
      }
    },
    "6": {
      "name": "Урок 6",
      "topics": {
        "1": {
          "name": "Структура йоги",
          "text": "Урок 6. Структура йоги\nТема 1\nСтруктура йоги\nЙога – это не хаотичный набор упражнений, а стройная си\nстема, состоящая из различных направлений, каждое из ко\nторых решает свои задачи. \nХатха йога\nНаправлена на очищение тела и подготовку его к высшим\nступеням йоги. Основные инструменты: шаткармы, асаны и\nпранаяма. \nРаджа йога\nЙога управления умом. Она включает в себя практики кон\nцентрации и медитации для достижения высших состояний\nсознания. \nКарма, Бхакти и Джняна йога\nКарма йога – йога действия, Бхакти – йога преданности и\nлюбви, Джняна – йога мудрости и знания. Все эти пути до\nполняют друг друга и ведут к одной цели. \nКрийя йога\nСчитается одной из самых мощных и быстрых систем са\nмосовершенствования, объединяющей в себе элементы всех\nвышеперечисленных направлений.\n310\nЙога и крийя. Вводный курс",
          "start_page": 310,
          "end_page": 323
        },
        "2": {
          "name": "Хатха йога. Агнисар крийя",
          "text": "Урок 6. Хатха йога. Агнисар крийя\nТема 2\nХатха йога  .   .   .   .  Агнисар крийя\nАгнисар крийя – это упражнение для «разжигания пищева\nрительного огня». Оно отлично стимулирует работу всех ор\nганов брюшной полости и помогает избавиться от вялости и\nзапоров. \nТехника выполнения\n1. Встаньте, слегка наклонившись вперед и упершись рука\nми в бедра.\n2. Сделайте глубокий вдох, а затем полный выдох.\n3. На задержке дыхания после выдоха быстро втягивайте и\nвыпячивайте живот. \n4. Сделайте столько движений, сколько сможете, прежде чем\nпочувствуете необходимость вдохнуть.\n5. Расслабьтесь и повторите 3–5 раз. \nЭто упражнение не только улучшает пищеварение, но и за\nряжает все тело энергией.\n324\nЙога и крийя. Вводный курс",
          "start_page": 324,
          "end_page": 330
        },
        "3": {
          "name": "Асаны. Практика",
          "text": "Урок 6. Асаны. Практика\nТема 3\nАсаны  .   .   .   .  Практика\nВ этом уроке мы познакомимся с двумя важными асанами:\nПашини мудра и Уштрасана. \nПашини мудра (поза петли)\nПрижмите колени к груди в положении сидя на корточках,\nзаведите руки за спину и обхватите ноги. Эта поза отлично\nрастягивает спину и успокаивает нервную систему. \nУштрасана (поза верблюда)\nВстаньте на колени и прогнитесь назад, касаясь руками пя\nток. Эта асана отлично растягивает переднюю поверхность\nтела и улучшает работу щитовидной железы. \nБудьте осторожны при выполнении прогибов, не делайте\nрезких движений и всегда слушайте свое тело.\n331\nЙога и крийя. Вводный курс",
          "start_page": 331,
          "end_page": 340
        },
        "4": {
          "name": "Асаны. Предмедитативные упражнения",
          "text": "Урок 6. Асаны. Предмедитативные упражнения\nТема 4\nАсаны  .   .   .   .  Предмедитативные упражнения\nМы продолжаем осваивать упражнения, которые помогут\nнам подготовиться к длительному сидению в медитативных\nпозах. \n«Вращение мельницы»\nСядьте, широко расставив ноги. Вращайте туловищем, ста\nраясь коснуться руками носков ног по кругу. Это упражне\nние отлично раскрепощает поясницу. \nДинамическое скручивание\nВ том же положении ног касайтесь правой рукой левой сто\nпы, а левой рукой – правой. Это упражнение делает позво\nночник гибким и улучшает кровообращение. \nРегулярное выполнение этих упражнений сделает ваше те\nло послушным и готовым к медитации.\n341\nЙога и крийя. Вводный курс",
          "start_page": 341,
          "end_page": 345
        },
        "5": {
          "name": "Пранаяма. Уджайи пранаяма и кхечари мудра",
          "text": "Урок 6. Пранаяма. Уджайи пранаяма и кхечари мудра\nТема 5\nПранаяма  .   .   .   .  Уджайи пранаяма и кхечари мудра\nУджайи пранаяма – это «психическое дыхание», которое ис\nпользуется во многих практиках крийя йоги. Оно отлично\nуспокаивает ум и замедляет ритм сердца. \nТехника выполнения\n1. Слегка сожмите голосовую щель, чтобы при дыхании воз\nникал мягкий шипящий звук (похожий на сопение спящего\nребенка).\n2. Дыхание должно быть глубоким, медленным и ровным.\nКхечари мудра (подготовка)\nЗаверните язык назад так, чтобы его кончик касался мягкого\nнеба. Это помогает удерживать энергию в теле и углубляет\nэффект уджайи пранаямы. \n346\nЙога и крийя. Вводный курс",
          "start_page": 346,
          "end_page": 350
        },
        "6": {
          "name": "Медитация. Практики для визуализации",
          "text": "Урок 6. Медитация. Практики для визуализации\nТема 6\nМедитация  .   .   .   .  Практики для визуализации\nВизуализация – это мощный метод тренировки ума. Она по\nмогает развить концентрацию и научиться создавать четкие\nвнутренние образы. \nТехника выполнения\n1. Закройте глаза и представьте себе простой объект (напри\nмер, розу или пламя свечи).\n2. Постарайтесь увидеть его максимально четко: цвет, форму,\nдетали.\n3. Если образ исчезает, просто создайте его заново. \n4. Постепенно переходите к более сложным образам. \nЭта практика отлично подготавливает ум к более глубоким\nстадиям медитации и тратаке.\n351\nЙога и крийя. Вводный курс",
          "start_page": 351,
          "end_page": 354
        }
      }
    },
    "7": {
      "name": "Урок 7",
      "topics": {
        "1": {
          "name": "Диета и пищеварение",
          "text": "Урок 7. Диета и пищеварение\nТема 1\nДиета и пищеварение\nТо, что мы едим, напрямую влияет на наше физическое и ум\nственное состояние. Йога уделяет большое внимание правиль\nному питанию как основе здоровья и духовного роста. \nПищеварение – ключ к здоровью\nСогласно йоге, большинство болезней начинаются в кишеч\nнике из-за накопления непереваренной пищи (амы). Поэтому\nважно не только то, ЧТО мы едим, но и КАК мы едим. \nПринципы йогического питания\n1. Ешьте только тогда, когда голодны.\n2. Тщательно пережевывайте пищу.\n3. Оставляйте желудок на четверть пустым.\n4. Ешьте в спокойной и приятной обстановке. \n5. Избегайте слишком горячей или слишком холодной пищи.\nПомните: ваша пища должна быть простой, свежей и нату\nральной.\n361\nЙога и крийя. Вводный курс",
          "start_page": 361,
          "end_page": 374
        },
        "2": {
          "name": "Асаны. Медитативные асаны",
          "text": "Урок 7. Асаны. Медитативные асаны\nТема 2\nАсаны  .   .   .   .  Медитативные асаны\nВ этом уроке мы познакомимся с классическими медитатив\nными позами, которые обеспечивают максимальную устой\nчивость и комфорт. \nПадмасана (поза лотоса)\nСамая известная и совершенная поза для медитации. Обе\nстопы лежат на противоположных бедрах. Требует хорошей\nгибкости коленей и бедер. \nСиддхасана (поза совершенства)\nСчитается одной из лучших поз для мужчин. Одна пятка\nприжата к промежности, другая – к лобковой кости. \nСиддха Йони Асана\nЖенский вариант сиддхасаны. \nСвастикасана (благоприятная поза)\nПохожа на сиддхасану, но стопы располагаются между бедра\nми и икрами. \nВыберите свою позу и практикуйте ее ежедневно, стараясь\nсохранять спину идеально прямой.\n375\nЙога и крийя. Вводный курс",
          "start_page": 375,
          "end_page": 393
        },
        "3": {
          "name": "Пранаяма. Практика",
          "text": "Урок 7. Пранаяма. Практика\nТема 3\nПранаяма  .   .   .   .  Практика\nВ этом уроке мы продолжаем совершенствовать нади шод\nхану (этап 3) и учимся осознавать тонкие потоки энергии во\nвремя дыхания. \nОсознание праны\nВо время вдоха представляйте, как жизненная энергия (пра\nна) входит в ваше тело и наполняет каждую его клетку.\nВо время выдоха представляйте, как из тела выходят все за\nгрязнения и блоки. \nРитм и покой\nВаше дыхание должно стать настолько тонким и бесшум\nным, чтобы вы почти перестали его чувствовать. Это состоя\nние глубокого внутреннего покоя является целью пранаямы.\n394\nЙога и крийя. Вводный курс",
          "start_page": 394,
          "end_page": 395
        },
        "4": {
          "name": "Медитация. введение",
          "text": "Урок 7. Медитация. введение\nТема 4\nМедитация  .   .   .   .  Введение\nМедитация – это не то, что можно «сделать». Это состояние,\nкоторое наступает спонтанно, когда тело расслаблено, а ум\nсосредоточен. \nЧто такое медитация?\nМедитация – это непрерывный поток осознания, направлен\nный на один объект. Это состояние за пределами мыслей, где\nвы переживаете свою подлинную природу. \nПрепятствия в медитации\nГлавным препятствием является наш беспокойный ум,\nкоторый постоянно стремится в прошлое или будущее. Йога\nдает нам инструменты, чтобы успокоить этот «внутренний\nшум».\nПольза медитации\nМедитация приносит глубокий покой, ясность ума, развивает\nинтуицию и помогает найти ответы на самые важные во\nпросы жизни.\n396\nЙога и крийя. Вводный курс",
          "start_page": 396,
          "end_page": 408
        },
        "5": {
          "name": "Медитация. Правила практики",
          "text": "Урок 7. Медитация. Правила практики\nТема 5\nМедитация  .   .   .   .  Правила практики\nДля того чтобы практика медитации была успешной, необ\nходимо соблюдать несколько простых правил. \nРегулярность\nЗанимайтесь каждый день в одно и то же время. Это создает\nпривычку в уме и облегчает вход в медитативное состояние. \nПоза\nВсегда сидите с прямой спиной. Неподвижность тела – залог\nнеподвижности ума. \nМесто\nВыберите чистое и тихое место, предназначенное только для\nмедитации. Это создаст там особую атмосферу. \nНе боритесь с мыслями\nПросто наблюдайте за ними со стороны. Чем меньше вы\nсопротивляетесь мыслям, тем быстрее они исчезают.\n409\nЙога и крийя. Вводный курс",
          "start_page": 409,
          "end_page": 418
        },
        "6": {
          "name": "Медитация. Кайя стхаирьям",
          "text": "Урок 7. Медитация. Кайя стхаирьям\nТема 6\nМедитация  .   .   .   .  Кайя стхаирьям (неподвижность тела)\nКайя стхаирьям – это важная практика подготовки к медита\nции. Она учит нас достигать абсолютной физической непо\nдвижности. \nТехника выполнения\n1. Примите свою медитативную позу и закройте глаза.\n2. Примите решение не шевелиться ни при каких обстоятель\nствах в течение всей практики. \n3. Почувствуйте, как ваше тело становится тяжелым и как\nбудто врастает в землю. \n4. Представьте, что вы – каменная статуя.\n5. Если возникает желание пошевелиться, просто осознавайте\nего, но не поддавайтесь ему. \nЧерез некоторое время физическая неподвижность приведет\nк автоматическому успокоению ума. Продолжайте практику\n10–15 минут.\n419\nЙога и крийя. Вводный курс",
          "start_page": 419,
          "end_page": 423
        }
      }
    },
    "8": {
      "name": "Урок 8",
      "topics": {
        "1": {
          "name": "Вегетарианство",
          "text": "Урок 8. Вегетарианство\nТема 1\nВегетарианство\nЙога рекомендует вегетарианскую диету как наиболее соот\nветствующую человеческой природе и способствующую ду\nховному развитию. \nЭтический аспект\nПринцип ахимсы (ненасилия) – это основа йогического об\nраза жизни. Отказ от мяса помогает нам развить сострадание\nко всем живым существам. \nЭнергетический аспект\nМясная пища считается «тяжелой» (тамасичной). Она делает\nум вялым и беспокойным. Вегетарианская пища (сатвиче\nская) дает телу легкую и чистую энергию. \nФизиологический аспект\nМногие современные исследования подтверждают пользу\nвегетарианства для здоровья сердца, сосудов и долголетия.\nПопробуйте постепенно переходить на растительную пищу,\nи вы почувствуете разницу в своем состоянии.\n428\nЙога и крийя. Вводный курс",
          "start_page": 428,
          "end_page": 438
        },
        "2": {
          "name": "Медитация и ум",
          "text": "Урок 8. Медитация и ум\nТема 2\nМедитация и ум\nНаш ум похож на беспокойную обезьяну, которая постоянно\nпрыгает с ветки на ветку. Медитация – это метод, позволяю\nщий приручить эту обезьяну. \nПрирода ума\nУм постоянно занят обработкой впечатлений, воспоминани\nями и планами. Это его естественная работа. Мы не должны\nего за это винить. \nКонцентрация (Дхарана)\nМедитация начинается с концентрации. Когда мы сосредо\nточиваем внимание на одном объекте (дыхании, мантре или\nобразе), ум постепенно перестает блуждать. \nПрорыв к тишине\nВ моменты глубокой концентрации наступает тишина. Это\nсостояние «не-ума», где вы просто ЕСТЬ. Это и есть подлин\nная медитация.\n439\nЙога и крийя. Вводный курс",
          "start_page": 439,
          "end_page": 459
        },
        "3": {
          "name": "Мудры. Положение рук при медитации",
          "text": "Урок 8. Мудры. Положение рук при медитации\nТема 3\nМудры .   .   .   .  Положение рук при медитации\nМудры – это специальные жесты рук, которые помогают за\nмкнуть энергетические цепи в теле и улучшить концентра\nцию. \nДжняна мудра\nСоедините кончики большого и указательного пальцев,\nостальные пальцы выпрямлены. Ладони направлены вверх.\nЭта мудра символизирует знание и мудрость. \nЧин мудра\nТо же самое, но ладони направлены вниз. Эта мудра помогает\n«заземлиться» и успокоиться. \nБхайрава мудра\nПоложите правую руку на левую (ладонями вверх) и держи\nте их на коленях. Это создает состояние глубокого внут\nреннего равновесия. \nИспользуйте эти мудры во время медитации и пранаямы.\n460\nЙога и крийя. Вводный курс",
          "start_page": 460,
          "end_page": 464
        },
        "4": {
          "name": "Пранаяма. Нади шодхана (этап 3)",
          "text": "Урок 8. Пранаяма. Нади шодхана (этап 3)\nТема 4\nПранаяма  .   .   .   .  Нади шодхана (этап 3)\nМы продолжаем совершенствовать нади шодхану, добавляя в\nнее задержку дыхания и четкий ритм. \nТехника выполнения\nСтарайтесь придерживаться ритма 1:4:2. Если вы вдыхаете за\n5 секунд, то задерживайте дыхание на 20 секунд и выды\nхайте за 10 секунд. \nРитм – это жизнь\nСоблюдение четкого ритма помогает синхронизировать ра\nботу всех систем организма и приводит ум в состояние со\nвершенного равновесия.\n465\nЙога и крийя. Вводный курс",
          "start_page": 465,
          "end_page": 472
        },
        "5": {
          "name": "Мудры. Агочари мудра",
          "text": "Урок 8. Мудры. Агочари мудра\nТема 5\nМудры  .   .   .   .  Агочари мудра\nАгочари мудра, или «взгляд на кончик носа», – это мощная\nпрактика концентрации, которая также является формой\nтратаки. \nТехника выполнения\n1. Сядьте с прямой спиной и закройте глаза.\n2. Откройте глаза и сфокусируйте их на кончике носа.\n3. Не перенапрягайте глаза. Если чувствуете усталость – за\nкройте их на несколько секунд.\n4. Постепенно увеличивайте время концентрации. \nЭта практика отлично укрепляет глазные мышцы и мгновен\nно успокаивает ум. Она также стимулирует важные энерге\nтические центры в голове.\n473\nЙога и крийя. Вводный курс",
          "start_page": 473,
          "end_page": 477
        },
        "6": {
          "name": "Медитация. Тратака (этап 1)",
          "text": "Урок 8. Медитация. Тратака (этап 1)\nТема 6\nМедитация  .   .   .   .  Тратака (этап 1)\nТратака – это практика немигающего созерцания объекта. На\nпервом этапе мы используем внешнюю точку концентрации,\nнапример, пламя свечи. \nТехника выполнения\n1. Поставьте зажженную свечу на уровне глаз на расстоянии\nвытянутой руки.\n2. Пристально смотрите на пламя (особенно на фитиль), не\nмигая и не отводя взгляда. \n3. Когда глаза устанут или начнут слезиться, закройте их.\n4. Наблюдайте послеобраз пламени перед закрытыми глаза\nми. \nПовторите 3–5 раз. Тратака отлично развивает концентра\nцию, улучшает память и зрение, а также очищает ум от на\nвязчивых мыслей.\n478\nЙога и крийя. Вводный курс",
          "start_page": 478,
          "end_page": 491
        }
      }
    },
    "9": {
      "name": "Урок 9",
      "topics": {
        "1": {
          "name": "Расстройства пищеварения",
          "text": "Урок 9. Расстройства пищеварения\nТема 1\nРасстройства пищеварения\nБолезни пищеварительной системы, к сожалению, являются\nочень распространенными в современном мире. Йога пред\nлагает целостный подход к их лечению и профилактике. \nПричины расстройств\nОсновными причинами являются неправильное питание,\nхронический стресс, недостаток физической активности и\nигнорирование естественных потребностей организма. Это\nведет к накоплению токсинов и нарушению работы органов\nпищеварения. \nМетоды йоги\nДля восстановления здоровья пищеварительной системы ис\nпользуются: \n1. Шаткармы (очистительные практики), такие как кунджал\nи лагху шанкхапракшалана, которые очищают желудок и\nкишечник. \n2. Асаны, стимулирующие работу органов брюшной полости\n(например, паванмуктасана, бхуджангасана, шалабхасана).\n3. Пранаяма, улучшающая кровообращение и снимающая\nнервное напряжение. \n4. Правильная диета и осознанное отношение к приему пищи.\nПомните, что здоровое пищеварение – это основа крепкого\nиммунитета и высокого уровня жизненной энергии.\n496\nЙога и крийя. Вводный курс",
          "start_page": 496,
          "end_page": 506
        },
        "2": {
          "name": "Устранение психологических проблем (часть 1)",
          "text": "Урок 9. Устранение психологических проблем (часть 1)\nТема 2\nУстранение психологических проблем (часть 1)\nМногие из наших физических недугов имеют психологиче\nские корни. Йога учит нас работать со своим подсознанием\nдля достижения целостного здоровья. \nПодавление и осознание\nБольшинство людей склонны подавлять свои эмоции и стра\nхи. Йога предлагает не подавлять их, а осознавать и прора\nбатывать. \nМетод самонаблюдения\nПростое наблюдение за своими реакциями со стороны помо\nгает нам перестать отождествляться с проблемами. Когда мы\nвидим проблему, она теряет над нами власть. \nРасслабление как лекарство\nГлубокое расслабление тела и ума позволяет нам выйти за\nпределы конфликтов и найти внутреннюю опору.\n507\nЙога и крийя. Вводный курс",
          "start_page": 507,
          "end_page": 524
        },
        "3": {
          "name": "Асаны. Практика",
          "text": "Урок 9. Асаны. Практика\nТема 3\nАсаны  .   .   .   .  Практика\nВ этом уроке мы познакомимся с асаной Шалабхасана (поза\nсаранчи), которая отлично укрепляет поясницу и улучшает\nпищеварение. \nТехника выполнения\nЛягте на живот, руки под бедрами. На вдохе поднимите обе\nноги максимально вверх, не сгибая их в коленях. Удержи\nвайте позу несколько секунд, затем выдохните и опустите\nноги. \nБлаготворное действие\nЭта асана массирует органы брюшной полости, стимулиру\nет работу почек и печени, а также укрепляет мышцы спины\nи ног.\n525\nЙога и крийя. Вводный курс",
          "start_page": 525,
          "end_page": 530
        },
        "4": {
          "name": "Пранаяма. Практика",
          "text": "Урок 9. Пранаяма. Практика\nТема 4\nПранаяма  .   .   .   .  Практика\nМы продолжаем практику нади шодханы, постепенно увеличи\nвая время задержки дыхания и достигая идеального ритма.\nСоблюдайте правила и не форсируйте процесс. Помните:\nйога – это терпение и регулярность.\n531\nЙога и крийя. Вводный курс",
          "start_page": 531,
          "end_page": 532
        },
        "5": {
          "name": "Мудры. Шамбхави мудра",
          "text": "Урок 9. Мудры. Шамбхави мудра\nТема 5\nМудры  .   .   .   .  Шамбхави мудра\nШамбхави мудра – это «взгляд в точку между бровями».\nЭта практика является одной из самых важных в йоге и\nтантру. \nТехника выполнения\n1. Сядьте в любую медитативную позу.\n2. Направьте взгляд вверх и в центр, стараясь увидеть точку\nмежду бровями. \n3. Вы должны увидеть V-образную фигуру из контуров бро\nвей. \n4. Сосредоточьтесь на этой вершине V. \nЭта мудра отлично успокаивает ум и подготавливает его к\nвысшим стадиям медитации.\n533\nЙога и крийя. Вводный курс",
          "start_page": 533,
          "end_page": 536
        },
        "6": {
          "name": "Медитация. Тратака (часть 2)",
          "text": "Урок 9. Медитация. Тратака (этап 2)\nТема 6\nМедитация  .   .   .   .  Тратака (этап 2)\nНа втором этапе тратаки мы соединяем внешнее созерцание\nс осознанием дыхания и психических каналов. \nТехника выполнения\n1. Созерцайте пламя свечи в течение 2–3 минут.\n2. Затем закройте глаза и представьте, как при вдохе поток\nсвета входит через межбровье и идет к затылку.\n3. При выдохе свет возвращается от затылка к межбровью.\n4. Постоянно удерживайте в уме образ пламени. \nЭта практика углубляет концентрацию и развивает внутрен\nнее видение.\n537\nЙога и крийя. Вводный курс",
          "start_page": 537,
          "end_page": 542
        }
      }

    "10": {
      "name": "Урок 10",
      "topics": {
        "1": {
          "name": "Гуру – путеводный маяк",
          "text": "Урок 10. Гуру – путеводный маяк\nТема 1\nГуру – путеводный маяк\nНа санскрите слово «гуру» означает «тот, кто устраняет\nтьму невежества». Роль учителя в йоге невозможно пере\nоценить. \nЗачем нужен гуру?\nГуру помогает ученику увидеть его собственные ошибки и\nблоки, которые сам он не замечает. Он дает силу и вдохно\nвение для продвижения по пути самопознания. \nОтношения гуру и ученика\nЭто отношения, основанные на доверии, любви и предан\nности. Гуру не навязывает свое мнение, он лишь указывает\nпуть, по которому ученик должен пройти сам. \nКак найти своего учителя?\nКогда ученик готов, гуру появляется сам. Ваша задача – ис\nкренне стремиться к знанию и практиковать йогу.\n547\nЙога и крийя. Вводный курс",
          "start_page": 547,
          "end_page": 551
        },
        "2": {
          "name": "Устранение психологических проблем (часть 2)",
          "text": "Урок 10. Устранение психологических проблем (часть 2)\nТема 2\nУстранение психологических проблем (часть 2)\nВ этой теме мы обсудим методы работы с осознаваемыми\nстрахами и фобиями. \nДесенсибилизация\nЭто метод постепенного привыкания к объекту своего стра\nха в состоянии глубокого расслабления. Представляйте се\nбе то, чего боитесь, пока не почувствуете, что страх исчез. \nСамовнушение\nИспользуйте положительные утверждения (аффирмации)\nдля того, чтобы перепрограммировать свой ум. Повторяйте\nих перед сном и сразу после пробуждения. \nМедитация для очищения ума\nНаблюдайте за своими страхами как свидетель. Не вовле\nкайтесь в них, и они постепенно потеряют свою силу.\n552\nЙога и крийя. Вводный курс",
          "start_page": 552,
          "end_page": 572
        },
        "3": {
          "name": "Хатха йога. Сутра нети",
          "text": "Урок 10. Хатха йога. Сутра нети\nТема 3\nХатха йога  .   .   .   .  Сутра нети\nСутра нети – это продвинутый метод очищения носа с по\nмощью резинового катетера или хлопковой нити. Он допол\nняет джала нети и отлично стимулирует нервные окончания\nв носоглотке. \nТехника выполнения\nОсторожно вставьте катетер в одну ноздрю и вытащите его\nконец через рот. Мягко подвигайте катетер туда-сюда. Повто\nрите для другой стороны. \nЭта практика отлично лечит хронические заболевания но\nса, улучшает зрение и делает ум очень острым.\n573\nЙога и крийя. Вводный курс",
          "start_page": 573,
          "end_page": 581
        },
        "4": {
          "name": "Асаны. Практика",
          "text": "Урок 10. Асаны. Практика\nТема 4\nАсаны  .   .   .   .  Практика\nВ этом уроке мы изучим Ардха Матсиендрасану (половин\nную позу скручивания позвоночника). \nТехника выполнения\nСядьте на пол, согните правую ногу и поставьте стопу за ле\nвое колено. Поверните туловище вправо, помогая себе ру\nками. Спина должна быть прямой. \nБлаготворное действие\nЭта асана отлично массирует органы брюшной полости, ле\nчит диабет и делает позвоночник невероятно гибким. Она\nтакже помогает снять глубокое умственное напряжение.\n582\nЙога и крийя. Вводный курс",
          "start_page": 582,
          "end_page": 590
        },
        "5": {
          "name": "Пранаяма. Практика",
          "text": "Урок 10. Пранаяма. Практика\nТема 5\nПранаяма  .   .   .   .  Практика\nПродолжайте практику нади шодханы, достигая идеального\nритма и легкости. Помните: качество дыхания важнее его\nпродолжительности.\n591\nЙога и крийя. Вводный курс",
          "start_page": 591,
          "end_page": 591
        },
        "6": {
          "name": "Мудры. Бхучари мудра",
          "text": "Урок 10. Мудры. Бхучари мудра\nТема 6\nМудры  .   .   .   .  Бхучари мудра\nБхучари мудра – это «взгляд в пустоту». Она помогает раз\nвить невероятную сосредоточенность и подготовить ум к\nглубокой медитации. \nТехника выполнения\nДержите глаза открытыми и пристально смотрите в пу\nстое пространство перед своим лицом. Пусть вас поглотит\n«ничто». Даже если перед глазами что-то происходит, не\nфокусируйтесь на этом. \nЭта практика отлично успокаивает ум и развивает интро\nспекцию.\n592\nЙога и крийя. Вводный курс",
          "start_page": 592,
          "end_page": 594
        },
        "7": {
          "name": "Медитация. Тратака (этап 3)",
          "text": "Урок 10. Медитация. Тратака (этап 3)\nТема 7\nМедитация  .   .   .   .  Тратака (этап 3)\nНа третьем этапе тратаки мы переходим к чисто внут\nреннему созерцанию объекта в точке между бровями. \nТехника выполнения\n1. Закройте глаза и представьте себе пламя свечи в межбро\nвье.\n2. Удерживайте этот образ максимально четко.\n3. Соедините созерцание с дыханием уджайи.\n4. Почувствуйте, как при вдохе образ как бы втягивается\nвнутрь головы, а при выдохе – выталкивается наружу. \nЭта практика является одной из самых мощных для объеди\nнения энергии ума.\n595\nЙога и крийя. Вводный курс",
          "start_page": 595,
          "end_page": 601
        }
      }
    },
    "11": {
      "name": "Урок 11",
      "topics": {
        "1": {
          "name": "Устранение психологических проблем (часть 3)",
          "text": "Урок 11. Устранение психологических проблем (часть 3)\nТема 1\nУстранение психологических проблем (часть 3)\nВ этой теме мы обсудим концепцию разотождествления как\nспособа обретения душевного покоя. \nКто вы на самом деле?\nМы часто отождествляем себя со своей работой, телом или\nчувствами. Но мы – это нечто гораздо большее. Мы – Сви\nдетель, который наблюдает за всем этим. \nПрактика разотождествления\nУчитесь наблюдать за своими действиями со стороны. Счи\nтайте себя актером, исполняющим роль. Это поможет вам\nне принимать близко к сердцу взлеты и падения жизни. \nСвобода от обусловленности\nЙога помогает нам избавиться от заученных шаблонов по\nведения и мышления, делая нас по-настоящему свободны\nми и спонтанными существами.\n606\nЙога и крийя. Вводный курс",
          "start_page": 606,
          "end_page": 625
        },
        "2": {
          "name": "Хатха йога. Лагху шанкхапракшалана",
          "text": "Урок 11. Хатха йога. Лагху шанкхапракшалана\nТема 2\nХатха йога  .   .   .   .  Лагху шанкхапракшалана\nЭто сокращенный вариант полной чистки кишечника. Он\nнамного проще в выполнении и отлично подходит для регу\nлярного очищения организма. \nТехника выполнения\n1. Выпейте 2 стакана теплой соленой воды.\n2. Выполните 5 специальных асан по 8 раз каждую.\n3. Снова выпейте 2 стакана воды и повторите асаны.\n4. Повторите процедуру в третий раз и идите в туалет. \nЭто упражнение отлично помогает при запорах и несва\nрении.\n626\nЙога и крийя. Вводный курс",
          "start_page": 626,
          "end_page": 631
        },
        "3": {
          "name": "Асаны. Шанкхапракшалана асаны",
          "text": "Урок 11. Асаны. Шанкхапракшалана асаны\nТема 3\nАсаны  .   .   .   .  Шанкхапракшалана асаны\nЭти пять асан специально предназначены для того, чтобы\nпроталкивать воду через пищеварительный тракт. \n1. Тадасана (поза пальмы)\n2. Тирьяка Тадасана (поза пальмы, раскачиваемой ветром)\n3. Кати Чакрасана (вращение в талии)\n4. Тирьяка Бхуджангасана (поворачивающаяся кобра)\n5. Ударакаршанасана (брюшной массаж) \nВыполняйте их именно в этой последовательности.\n632\nЙога и крийя. Вводный курс",
          "start_page": 632,
          "end_page": 641
        },
        "4": {
          "name": "Пранаяма. Практика",
          "text": "Урок 11. Пранаяма. Практика\nТема 4\nПранаяма  .   .   .   .  Практика\nВ этом уроке мы познакомимся с понятием Кевала Кумбха\nка – спонтанной задержкой дыхания, которая наступает в\nсостоянии самадхи.\n642\nЙога и крийя. Вводный курс",
          "start_page": 642,
          "end_page": 643
        },
        "5": {
          "name": "Тратака и сосредоточение",
          "text": "Урок 11. Тратака и сосредоточение\nТема 5\nТратака и сосредоточение\nСосредоточение – это ключ к успеху в йоге. Тратака помо\nгает нам объединить все силы ума и направить их в одну\nточку. \nСила лазера\nОбычный ум похож на лампочку, свет которой рассеивается\nповсюду. Сосредоточенный ум похож на лазер, который спо\nсобен пробить любую преграду. \nФизиология тратаки\nТратака напрямую воздействует на шишковидную железу,\nкоторая является «антенной» для приема высших вибраций.\n644\nЙога и крийя. Вводный курс",
          "start_page": 644,
          "end_page": 649
        },
        "6": {
          "name": "Медитация. Практика",
          "text": "Урок 11. Медитация. Практика\nТема 6\nМедитация  .   .   .   .  Практика\nВ этом уроке мы предлагаем использовать стихи поэтов-\nмистиков как объект для размышления и медитации. \nПопробуйте осознать глубокий смысл этих слов, не огра\nничиваясь интеллектуальным пониманием.\n650\nЙога и крийя. Вводный курс",
          "start_page": 650,
          "end_page": 652
        }
      }
    },
    "12": {
      "name": "Урок 12",
      "topics": {
        "1": {
          "name": "Карма йога (часть 1)",
          "text": "Урок 12. Карма йога (часть 1)\nТема 1\nКарма йога (часть 1)\nКарма йога – это йога действия. Она учит нас тому, как пре\nвратить нашу повседневную работу в путь к духовному осво\nбождению. \nДействие без привязанности\nОсновной принцип карма йоги – выполнять свои обязанно\nсти максимально эффективно, но не привязываться к резуль\nтатам труда. \nРабота как медитация\nКогда мы полностью поглощены своим делом и выполняем\nего с осознанием, работа становится формой медитации.\nЭто помогает растворить эго и найти внутренний покой.\n656\nЙога и крийя. Вводный курс",
          "start_page": 656,
          "end_page": 675
        },
        "2": {
          "name": "Хатха йога. Шанкхапракшалана",
          "text": "Урок 12. Хатха йога. Шанкхапракшалана\nТема 2\nХатха йога  .   .   .   .  Шанкхапракшалана\nЭто полная очистка всего пищеварительного тракта. Она\nсчитается одной из самых мощных оздоровительных прак\nтик в йоге. \nТехника выполнения\nПроцедура включает в себя питье большого количества теп\nлой соленой воды и выполнение специальных асан до тех\nпор, пока из кишечника не пойдет чистая вода. \nВажные правила\nПосле практики необходимо съесть специальное блюдо\n(кхичри) с большим количеством масла ги и соблюдать стро\nгую диету в течение недели. Эту процедуру лучше всего вы\nполнять под руководством опытного наставника.\n676\nЙога и крийя. Вводный курс",
          "start_page": 676,
          "end_page": 689
        },
        "3": {
          "name": "Асаны. Практика",
          "text": "Урок 12. Асаны. Практика\nТема 3\nАсаны  .   .   .   .  Практика\nВ этом уроке мы познакомимся с группой асан, выполня\nемых стоя: Триконасана, Двиконасана и Доласана. Они от\nлично укрепляют все тело и делают позвоночник гибким.\n690\nЙога и крийя. Вводный курс",
          "start_page": 690,
          "end_page": 698
        },
        "4": {
          "name": "Пранаяма. Нади шодхана (этап 4)",
          "text": "Урок 12. Пранаяма. Нади шодхана (этап 4)\nТема 4\nПранаяма  .   .   .   .  Нади шодхана (этап 4)\nНа четвертом этапе мы вводим внешнюю задержку дыхания\n(бахир кумбхака). Это завершающая стадия очищения ка\nналов, которая требует максимального сосредоточения и\nконтроля.\n699\nЙога и крийя. Вводный курс",
          "start_page": 699,
          "end_page": 701
        },
        "5": {
          "name": "Медитация. Повторение АУМ",
          "text": "Урок 12. Медитация. Повторение АУМ\nТема 5\nМедитация  .   .   .   .  Повторение АУМ\nАУМ – это священный звук вселенной. Его повторение по\nмогает быстро успокоить ум и настроиться на высшие виб\nрации. \nТехника выполнения\nСядьте в удобную позу и нараспев произносите А-У-М,\nстараясь почувствовать вибрацию звука во всем теле. Это\nсоздает состояние глубокого гармонии и блаженства.\n702\nЙога и крийя. Вводный курс",
          "start_page": 702,
          "end_page": 710
        }
      }
    }
  }
